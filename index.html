<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Calculadora de IMC</title>
    <link rel='stylesheet' href='main.css'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
</head>

<body>

    <div class="centro">
        <h1 id="titulo">Calculadora</h1>
        <div id="calculadora">
            <div id="display_area">
                <div id="display">0</div>
                <div id="display_resultado">=</div>
            </div>

            <div id="tipos">
                <div class="num" id="subtracao">-</div>
                <div class="num" id="soma">+</div>
                <div class="num" id="divisao">/</div>
                <div class="num" id="multiplicacao">X</div>
            </div>

            <div id="numeros">

                <div class="num" id="1">1</div>
                <div class="num" id="2">2</div>
                <div class="num" id="3">3</div>

                <div class="num" id="4">4</div>
                <div class="num" id="5">5</div>
                <div class="num" id="6">6</div>

                <div class="num" id="7">7</div>
                <div class="num" id="8">8</div>
                <div class="num" id="9">9</div>

                <div class="num" id="0">0</div>
                <div class="num" id="limpar"> Limpar</div>
                <div class="num" id="calcular">Calcular</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
